services:

  # ── App (FastAPI + React) ───────────────────────────────────────────────────
  app:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - OLLAMA_EVAL_MODEL=${OLLAMA_EVAL_MODEL:-llama3.2}
      - OPIK_API_KEY=${OPIK_API_KEY}
      - OPIK_WORKSPACE=${OPIK_WORKSPACE}
      - OPIK_PROJECT_NAME=${OPIK_PROJECT_NAME}
    volumes:
      - chroma_data:/app/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  # ── Dev: Vite dev server (hot-reload, proxies API to app:8000) ─────────────
  frontend-dev:
    image: node:20-alpine
    working_dir: /frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    environment:
      - VITE_API_TARGET=http://app:8000
    profiles: ["dev"]

volumes:
  chroma_data:
    labels:
      com.project.warning: "WARNING: 'docker compose down -v' destroys the RAG index. Use 'docker compose down' without -v to preserve it."
